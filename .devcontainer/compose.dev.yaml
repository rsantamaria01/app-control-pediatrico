# Devcontainer overlay: adds the workspace service next to db/cache/storage from ../compose.yaml.
# Relative paths resolve from the repo root (directory of the first compose file), not from .devcontainer/.
services:
  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
  workspace:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - .:/workspaces/app-control-pediatrico:cached
      - pnpm-store:/root/.local/share/pnpm
      - opencode-data:/root/.local/share/opencode
    env_file:
      - path: /root/.config/app-monitoreo-pediatrico/secrets.env
        required: false
    environment:
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Raul Santamaria}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-Raul Santamaria}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-raulsantamariao@hotmail.com}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-raulsantamariao@hotmail.com}
      DATABASE_URL: postgres://pediatrico:${DB_PASSWORD:-pediatrico}@db:5432/pediatrico
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_FROM: access@pediatrico.test
      REDIS_URL: redis://cache:6379
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: pediatrico
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pediatrico}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pediatrico-dev-secret}
      NUXT_HOST: 0.0.0.0

volumes:
  pnpm-store: {}
  opencode-data: {}
