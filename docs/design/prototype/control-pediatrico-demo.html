<title>Control Pediátrico Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: guía a la izquierda + teléfono interactivo a la derecha; en teléfono, la app ocupa todo el ancho y la guía va debajo. */
:root{
  --bg:#eef3f2;--surface:#ffffff;--surface2:#f8fafc;--line:#e2e8f0;--line2:#cbd5e1;
  --ink:#0f172a;--ink2:#475569;--ink3:#64748b;
  --pri:#0f766e;--pri-ink:#ffffff;--pri-soft:#f0fdfa;--pri-soft-ink:#115e59;
  --ok-bg:#dcfce7;--ok-ink:#166534;--wa-bg:#fef9c3;--wa-ink:#713f12;--ri-bg:#ffedd5;--ri-ink:#9a3412;--ou-bg:#fee2e2;--ou-ink:#991b1b;--na-bg:#f1f5f9;--na-ink:#475569;
  --c-med:#334155;--c-sd1:#ca8a04;--c-sd2:#ea580c;--c-sd3:#dc2626;--c-grid:#f1f5f9;--c-axis:#cbd5e1;--c-band-ok:#16a34a;--c-band-wa:#eab308;--c-band-ri:#ea580c;--c-pt:#1d4ed8;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 20px 50px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-size:16px}
.brand small{display:block;font-size:12px;color:var(--ink3)}
.roles{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.roles button{border:0;background:transparent;min-height:40px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.cbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.fmt button{display:inline-flex;align-items:center;gap:6px}
@media (max-width:760px){.fmt{display:none}}

/* formato escritorio */
.wrap.desk{max-width:1440px}
.stage.desk{flex-direction:column;gap:20px}
.stage.desk .guide{max-width:none;order:2;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px 24px;align-items:start}
.stage.desk .guide > .eyebrow,.stage.desk .guide > h2,.stage.desk .guide > p:not(.note):not(.pending){grid-column:1}
.stage.desk .guide > .try,.stage.desk .guide > .pending,.stage.desk .guide > .note{grid-column:2}
.side-brand{display:none}
.device.desk{width:100%;height:820px;border-radius:18px;margin:0;flex-direction:row}
.device.desk.topnav{flex-direction:column}
.device.desk .tabbar{order:-1}
.device.desk.sidenav .tabbar{flex-direction:column;width:236px;flex:none;min-height:0;border-top:0;border-right:1px solid var(--line);padding:14px 12px;gap:2px;justify-content:flex-start}
.device.desk.topnav .tabbar{border-top:0;border-bottom:1px solid var(--line);min-height:64px;padding:0 20px;gap:4px;align-items:center}
.device.desk .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;min-height:44px;padding:0 12px;border-radius:10px}
.device.desk .tabbar button[aria-current="page"]{background:var(--pri-soft)}
.device.desk .tabbar .dot{position:static;margin-left:auto}
.device.desk.topnav .tabbar .dot{margin-left:4px}
.device.desk .side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700}
.device.desk.topnav .side-brand{padding:0;margin-right:auto}
.device.desk .side-brand small{display:block;font-weight:500;font-size:12px;color:var(--ink3)}
.device.desk .bar .mark{display:none}
.device.desk .bar{padding-left:24px}
.device.desk .bar.back{padding-left:12px}
.device.desk .screen .body{max-width:1120px;width:100%;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.device.desk .body > *{grid-column:1/-1}
.device.desk .body > .half{grid-column:auto}
.device.desk.narrow .screen .body{max-width:720px;display:flex}
.device.desk .hscroll{flex-wrap:wrap;overflow:visible}
.device.desk .mini{flex:1 1 170px}
.device.desk .chip{min-width:150px}
.device.desk .chartbox svg{max-height:440px}
.device.desk .hero{padding:48px 24px 32px}

/* stage */
.stage{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.guide{flex:1 1 280px;max-width:420px;min-width:0;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.guide .eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--pri-soft-ink)}
.guide h2{font-size:24px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.guide p{color:var(--ink2)}
.try{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.try b{display:block;font-size:13px;margin-bottom:6px}
.try ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.note{font-size:13px;color:var(--ink3)}
.pending{font-size:13px;background:var(--wa-bg);color:var(--wa-ink);border-radius:10px;padding:10px 12px}

.device{flex:none;width:390px;max-width:100%;height:790px;background:var(--surface2);border:1px solid var(--line2);border-radius:38px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;margin-left:auto}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
@media (max-width:760px){
  .stage{flex-direction:column;gap:20px}
  .device{order:-1;width:100%;margin:0;height:auto;min-height:640px;border-radius:24px}
  .screen{overflow:visible}
  .guide{max-width:none}
}
@media (prefers-reduced-motion: reduce){.screen{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

/* app chrome */
.bar{position:sticky;top:0;z-index:5;min-height:56px;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.back{padding-left:4px}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer;flex:none}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface);min-height:64px}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink3);cursor:pointer;position:relative}
.tabbar button[aria-current="page"]{color:var(--pri-soft-ink);font-weight:700}
.tabbar .dot{position:absolute;top:10px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--pri);color:var(--pri-ink);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
@media (max-width:760px){.tabbar{position:sticky;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}}

.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.h{font-size:15px;font-weight:600}
.big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sm{font-size:13px}.xs{font-size:12px}.t2{color:var(--ink2)}.t3{color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.p{background:var(--pri);color:var(--pri-ink)}
.btn.o{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.g{background:transparent;color:var(--pri-soft-ink)}
.btn.sm2{min-height:40px;font-size:14px;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--ou-ink)}
.full{width:100%}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok-ink)}.wa{background:var(--wa-bg);color:var(--wa-ink)}.ri{background:var(--ri-bg);color:var(--ri-ink)}.ou{background:var(--ou-bg);color:var(--ou-ink)}.na{background:var(--na-bg);color:var(--na-ink)}.pr{background:var(--pri-soft);color:var(--pri-soft-ink)}
.av{width:40px;height:40px;border-radius:99px;background:var(--na-bg);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.av.pr{background:var(--pri-soft);color:var(--pri-soft-ink)}
.list{overflow:hidden}
.li{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;min-height:64px}
.list .li:first-of-type{border-top:0}
.li .grow{flex:1;min-width:0}
.li .name{font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--pri);background:var(--pri);color:var(--pri-ink)}
.chip[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.seg{display:flex;padding:3px;border-radius:11px;background:var(--na-bg);gap:2px}
.seg button{flex:1;border:0;background:transparent;min-height:38px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;padding:0 8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.1)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;min-height:44px;padding:0 12px;font-weight:500;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--pri-soft-ink);border-color:var(--pri);font-weight:700}
.field label,.lbl{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-bottom:6px}
.inp{display:flex;align-items:center;gap:8px;min-height:48px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);padding:0 12px}
.inp:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.inp input,.inp select,textarea{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;width:100%;min-width:0}
textarea{display:block;min-height:76px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);padding:10px 12px;resize:vertical}
textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.unit{color:var(--ink3);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.radio{display:flex;gap:8px}
.radio button{flex:1;min-height:48px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 12px}
.radio button::before{content:"";width:16px;height:16px;border-radius:99px;border:2px solid var(--line2);flex:none}
.radio button[aria-checked="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-soft-ink)}
.radio button[aria-checked="true"]::before{border:5px solid var(--pri)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:12px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.status{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sic{width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none}
.cardbtn{width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.mini{min-width:150px;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mini.on{border-color:var(--pri)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 8px}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 8px 0;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--ink3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
.otp{letter-spacing:.6em;font-size:24px;font-weight:700;text-align:center}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--pri-ink);margin-top:1px}
.check[aria-checked="true"] .box{background:var(--pri);border-color:var(--pri)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line2);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--pri)}
.sw[aria-checked="true"]::after{left:21px;background:var(--pri-ink)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero{background:var(--pri-soft);padding:28px 20px 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;max-width:min(420px,calc(100% - 32px));background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}
.hl{background:var(--pri-soft);color:var(--pri-soft-ink);padding:0 4px;border-radius:4px;font-weight:600}
.empty{padding:24px 14px;text-align:center;color:var(--ink3);font-size:14px}

/* informe PDF (hoja A4 a 96 dpi: 794 × 1123 px), siempre papel blanco */
.rtools{position:sticky;top:56px;z-index:4;display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.pages{padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;background:#e2e8f0}
.a4wrap{width:100%;max-width:794px;overflow:hidden}
.a4{width:794px;height:1123px;background:#fff;color:#0f172a;transform-origin:top left;padding:44px 52px;display:flex;flex-direction:column;gap:16px;font-size:12px;line-height:1.45;box-shadow:0 4px 18px rgba(15,23,42,.15)}
.a4 h2{font-size:13px;font-weight:700;margin-bottom:6px}
.a4 .k{font-size:10.5px;color:#64748b}
.a4 table{font-size:11.5px}.a4 th{color:#64748b;font-size:10.5px;padding:6px 8px;border-bottom:1px solid #e2e8f0}.a4 td{padding:6px 8px;border-bottom:1px solid #e2e8f0}
.a4 .rh{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:2px solid #0f766e}
.a4 .rg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;padding:10px 12px;background:#f8fafc;border-radius:8px}
.a4 .rbox{border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px}
.a4 .rfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #e2e8f0;padding-top:10px}
.a4 .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:600;background:#f1f5f9;color:#475569}
.a4 .tag.f{background:#ffedd5;color:#9a3412}.a4 .tag.ok{background:#dcfce7;color:#166534}.a4 .tag.x{background:#fee2e2;color:#991b1b}
.a4 .soft{background:#f0fdfa;border-radius:8px;padding:10px 12px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="36" height="36" aria-hidden="true"><rect width="64" height="64" rx="14" style="fill:var(--pri)"/><path d="M14 46C24 44 30 36 36 28S46 18 50 17" fill="none" style="stroke:var(--pri-ink)" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="17" r="5" style="fill:var(--pri-ink)"/></svg>
      <div><b>Control Pediátrico</b><small>Demo interactiva · datos ficticios</small></div>
    </div>
    <div class="roles" role="group" aria-label="Ver la app como">
      <button type="button" data-role="medico">Médico</button>
      <button type="button" data-role="padres">Padres</button>
      <button type="button" data-role="asistente">Asistente</button>
      <button type="button" data-role="nueva">Familia nueva</button>
      <button type="button" data-role="admin">Admin</button>
      <button type="button" data-role="acceso">Acceso y sistema</button>
    </div>
    <div class="roles fmt" role="group" aria-label="Formato">
      <button type="button" data-fmt="phone"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2"/></svg>Teléfono</button>
      <button type="button" data-fmt="desk"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 20h8M12 16v4"/></svg>Escritorio</button>
    </div>
    <button type="button" class="cbtn" id="commentBtn" hidden>
      <svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Comentar esta pantalla
    </button>
  </header>

  <div class="stage" id="stage">
    <aside class="guide" id="guide" aria-live="polite"></aside>
    <div class="device" id="device">
      <div class="screen" id="screen" data-comment-target></div>
      <nav class="tabbar" id="tabbar" aria-label="Navegación de la app"></nav>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
/* ---------- icons ---------- */
const P = {
  home:'M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
  cal:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
  bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0',

/* ---------- informe PDF ---------- */
const RC = {
  peso:{t:'Peso para la edad', y:'Peso (kg)', at:(z,a)=>wAt(z,a), min:1.5, max:15.5, ticks:[2,4,6,8,10,12,14], v:m=>m.w},
  talla:{t:'Longitud para la edad', y:'Longitud (cm)', at:(z,a)=>lenAt(z,a), min:42, max:96, ticks:[45,55,65,75,85,95], v:m=>m.l},
  pc:{t:'Perímetro cefálico para la edad', y:'Perímetro cefálico (cm)', at:(z,a)=>pcAt(z,a), min:29, max:52, ticks:[30,35,40,45,50], v:m=>m.pc}
};
function reportChart(ind) {
  const c = RC[ind], W=640, H=270, x0=46, x1=600, y0=228, y1=10;
  const X = a => x0 + (x1-x0)*a/24, Y = v => y0 - (y0-y1)*(v-c.min)/(c.max-c.min);
  const ages = Array.from({length:25},(_,i)=>i);
  const line = z => ages.map((a,i)=>`${i?'L':'M'}${X(a).toFixed(1)},${Y(c.at(z,a)).toFixed(1)}`).join(' ');
  const band = (za,zb) => line(za) + ' ' + ages.slice().reverse().map(a=>`L${X(a).toFixed(1)},${Y(c.at(zb,a)).toFixed(1)}`).join(' ') + 'Z';
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.t}, niña, 0 a 2 años" style="display:block;width:100%;height:auto">`;
  s += `<path d="${band(-2,2)}" fill="#16a34a" fill-opacity=".08"/>`;
  c.ticks.forEach(t => { s += `<path d="M${x0},${Y(t).toFixed(1)}H${x1}" stroke="#f1f5f9"/><text x="${x0-6}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#64748b">${t}</text>`; });
  for (let a=0;a<=24;a+=3) s += `<text x="${X(a).toFixed(1)}" y="${y0+15}" text-anchor="middle" font-size="10" fill="#64748b">${a}</text>`;
  s += `<text x="${(x0+x1)/2}" y="${H-4}" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">Edad (meses)</text><text x="11" y="${(y0+y1)/2}" text-anchor="middle" font-size="10" font-weight="500" fill="#475569" transform="rotate(-90 11 ${(y0+y1)/2})">${c.y}</text>`;
  s += `<path d="M${x0},${y1}V${y0}H${x1}" fill="none" stroke="#cbd5e1"/>`;
  [[3,'#dc2626',1.3,''],[2,'#ea580c',1.3,''],[1,'#ca8a04',1,'4 3']].forEach(([z,col,w,da]) => { s += `<path d="${line(z)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${da}"/><path d="${line(-z)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${da}"/>`; });
  s += `<path d="${line(0)}" fill="none" stroke="#334155" stroke-width="1.8"/>`;
  [[3,'+3','#dc2626'],[2,'+2','#ea580c'],[1,'+1','#a16207'],[0,'0','#334155'],[-1,'−1','#a16207'],[-2,'−2','#ea580c'],[-3,'−3','#dc2626']].forEach(([z,t,col]) => { s += `<text x="${x1+4}" y="${(Y(c.at(z,24))+3.5).toFixed(1)}" font-size="9.5" font-weight="700" fill="${col}">${t}</text>`; });
  const pts = st.meas.map(m => [X(m.a), Y(c.v(m))]);
  s += `<path d="${pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}" fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-linejoin="round"/>`;
  pts.forEach(p => { s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>`; });
  return s + '</svg>';
}

    tab += `<button class="btn o full" style="justify-content:space-between" aria-expanded="${st.pDetails}" data-act="details">Ver detalles${ic(st.pDetails?'x':'next','s')}</button>`;
    if (st.pDetails) tab += `<div class="card" style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th class="r">${CF[pk].name}</th><th class="r">Puntaje Z</th></tr></thead><tbody>${st.meas.slice(-4).reverse().map(mm => `<tr><td>${esc(mm.d)}</td><td class="r">${f(CF[pk].v(mm), CF[pk].d)} ${CF[pk].u}</td><td class="r">${fz(CF[pk].z(mm))}</td></tr>`).join('')}</tbody></table><p class="xs t3" style="padding:10px">El puntaje Z compara con niñas de la misma edad (OMS). Entre −2 y +2 es la zona esperada.</p></div>`;
  } else if (st.pTab === 'vacunas') {
    const x = st.vac.filter(v => v.s==='x'), ap = st.vac.filter(v => v.s==='a'), pe = st.vac.filter(v => v.s==='p');
    const grp = (title, list, cls, icon, sub) => list.length ? `<section class="card list"><div class="between" style="padding:10px 14px"><span class="xs t3" style="font-weight:700">${title}</span><span class="badge ${cls}">${list.length}</span></div>${list.map(v => `<div class="li" style="cursor:default;min-height:56px"><span class="sic ${cls}">${ic(icon,'s')}</span><span class="grow"><span class="name sm">${esc(v.n)}</span> <span class="xs t3">(ejemplo)</span><br><span class="xs t3">${esc(v.g)} · ${sub(v)}</span></span></div>`).join('')}</section>` : '';
    tab = (x.length ? `<div class="alert ou">${ic('clock','s')}<span>Tiene ${x.length} vacuna atrasada. Pida que se la apliquen en la próxima cita.</span></div>` : `<div class="alert ok">${ic('check','s')}<span>Vacunas al día.</span></div>`)
      + grp('ATRASADAS', x, 'ou', 'clock', v => esc(v.f))
      + grp('PRÓXIMAS', pe, 'na', 'cal', v => esc(v.f))
      + grp('APLICADAS', ap, 'ok', 'check', v => 'aplicada el ' + esc(v.f));
  } else if (st.pTab === 'hitos') {
    tab = `<section class="card list">${st.hitos.map(h => `<div class="li" style="cursor:default"><span class="sic ${h.a?'ok':'na'}">${ic(h.a?'check':'clock','s')}</span><span class="grow"><span class="name">${esc(h.n)}</span><br><span class="xs t3">${esc(h.d)} · ${h.a ? 'Lo logró a los ' + esc(h.a) : 'Esperado: ' + esc(h.w)}</span></span></div>`).join('')}</section>`;
  } else {
    tab = st.recs.slice().reverse().map((r,i) => `<div class="card pad" style="${i===0?'border-color:var(--pri)':''}"><p class="xs t3">${esc(r.d)} · Dra. Salazar</p><p class="sm" style="font-weight:700;margin-top:6px">Recomendaciones</p><p>${esc(r.t)}</p>${r.ind ? `<p class="sm" style="font-weight:700;margin-top:8px">Indicaciones médicas</p><p>${esc(r.ind)}</p>` : ''}</div>`).join('');
  }
  return bar('Valentina', 'padres-inicio') + `<div class="body">
  <button class="btn o full" data-go="padres-informe">${ic('file')}Ver informe PDF</button>
  <div class="tabs" role="tablist">${[['crecimiento','Crecimiento'],['vacunas','Vacunas'],['hitos','Hitos'],['consejos','Consejos']].map(([k,l]) => `<button role="tab" aria-selected="${st.pTab===k}" data-act="ptab" data-arg="${k}">${l}</button>`).join('')}</div>
  ${tab}</div>`;
};

  ukid: a => { const [id, k] = a.split('|'); const u = st.parents.find(x => x.id == id); u.kids = u.kids.filter(x => x !== k); render(true); toast(`${k} desvinculado de ${u.n}.`); },
  ulink: id => { const u = st.parents.find(x => x.id == id); const k = ['Valentina','Tomás','Renata'].find(x => !u.kids.includes(x)); if (!k) { toast('Ya tiene vinculados a todos los niños de la demo.'); return; } u.kids.push(k); render(true); toast(`${k} vinculado a ${u.n}.`); },
  ctab: t => { st.cTab = t; render(true); },
  prov: v => { st.prov = v; render(true); },
  tokenrep: () => toast('Pegue el token nuevo; el anterior deja de funcionar al guardar.'),
  testmsg: () => toast('Mensaje de prueba enviado al número de la clínica.'),
  rule: i => { st.rules[i][1] = !st.rules[i][1]; render(true); },
  autab: t => { st.auTab = t; st.dataAsk = null; render(true); },
  csv: () => toast('En la app real se descarga el registro en CSV.'),
  dreq: id => { const r = st.dataReqs.find(x => x.id == id); if (r.type === 'Eliminación') { st.dataAsk = r.id; render(true); } else { r.s = 'Completada · enviada por email'; render(true); toast('Exportación generada y enviada al email de la familia.'); } },
  dreqok: id => { const r = st.dataReqs.find(x => x.id == id); r.s = 'Completada · cuenta eliminada'; st.dataAsk = null; render(true); toast('Cuenta eliminada. La historia clínica se conserva según la ley.'); },
  dreqno: () => { st.dataAsk = null; render(true); },
  dreqrej: id => { const r = st.dataReqs.find(x => x.id == id); r.s = 'Rechazada · se informó el motivo'; render(true); }
};

document.addEventListener('click', e => {
  const fb = e.target.closest('[data-fmt]');
  if (fb) { fmt = fb.dataset.fmt; try { localStorage.setItem('cp-demo-fmt', fmt); } catch (err) {} render(); return; }
  const roleBtn = e.target.closest('[data-role]');
  if (roleBtn) { st.agSel = null; st.agMode = null; go(ROLE_START[roleBtn.dataset.role]); return; }
  const rg = e.target.closest('[data-role-go]');
  if (rg) { go(ROLE_START[rg.dataset.roleGo] || 'padres-inicio'); return; }
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && A[a.dataset.act] && a.tagName !== 'SELECT') { if (a.disabled) return; A[a.dataset.act](a.dataset.arg); }
});
document.addEventListener('input', e => {
  const ds = e.target.dataset || {};
  if (ds.avail) { const [i,j] = ds.avail.split(','); st.avail.days[+i][+j] = e.target.value; return; }
  if (ds.guard) { const [i,j] = ds.guard.split(','); st.np.guards[+i][j] = e.target.value; return; }
  const k = ds.bind; if (!k) return;
  const [o, p] = k.includes('.') ? k.split('.') : [null, k];
  if (o) st[o][p] = e.target.value; else st[p] = e.target.value;
  if (k.startsWith('draft.')) { const z = document.getElementById('zprev'); if (z) z.innerHTML = zPreview(); }
  if (k === 'q') { const l = document.getElementById('plist'); if (l) l.innerHTML = patientList(); }
  if (k === 'np.gw' || k === 'np.gd') { const n = document.getElementById('npPre'); if (n) n.innerHTML = npPre(); }
  if (ds.rerender) { render(true); return; }
  if (k === 'nf.otp') { const b = document.getElementById('sendReq'); if (b) b.disabled = !(st.nf.consent && /^\d{6}$/.test(st.nf.otp)); }
});
document.addEventListener('change', e => { const ds = e.target.dataset || {}; if (e.target.tagName === 'SELECT' && (ds.bind || ds.avail || ds.guard)) e.target.dispatchEvent(new Event('input', {bubbles:true})); });

/* ---------- comments (opens claude.ai's own composer) ---------- */
let commentsReady = false;
const $cb = document.getElementById('commentBtn');
(async () => {
  try {
    const c = window.claude && window.claude.use ? await window.claude.use('comments') : null;
    if (!c) return;
    commentsReady = true; $cb.hidden = false; render(true);
    $cb.addEventListener('click', async () => {
      try { await c.openComposer({ element: $screen }); }
      catch (err) { $cb.hidden = true; commentsReady = false; render(true); toast('Los comentarios no están disponibles en esta vista.'); }
    });
  } catch (e) {}
})();

/* ---------- boot ---------- */
const fromHash = () => { const h = (location.hash || '').slice(1); return R[h] ? h : null; };
window.addEventListener('hashchange', () => { const h = fromHash(); if (h && h !== st.route) { st.route = h; render(); } });
st.route = fromHash() || 'medico-inicio';
render();
})();
</script>
